<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小兔鲜儿</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/iconfont.css">
    <link rel="stylesheet" href="./css/login.css"> <!-- 新增的登录页面样式 -->
</head>
<body>
    <!-- 登录主体 -->
    <div class="login-container">
        <!-- 登录表单 -->
        <div class="login-right">
             <div class="auth-box"><!--认证盒子 -->
                <h2 class="auth-title">用户登录</h2>
                <form id="login-form">

                    <div class="form-group">
                        <label for="username">
                            用户名/手机号
                        </label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名或手机号" required>
                        <!-- <div class="error-message" id="username-error"></div> -->
                    </div>

                    <div class="form-group">
                        
                        <label for="password">
                            密码
                        </label> 
                        <input type="password" id="password" name="password" placeholder="请输入密码" required>
                        
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        登录<a href="index.html" class="register-link"></a>
                    </button>
                    <div class="auth-links">
                        还没有账号？<a href="register.html" class="register-link">立即注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="./js/login.js"></script>
</body>
</html>
